# .github/workflows/build-windows-arm64.yml
name: build-windows-arm64

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: windows-11-arm

    env:
      QT_VERSION: 6.10.3
      QT_ARCH: win64_msvc2022_arm64
      QtRoot: ${{ github.workspace }}\qt
      BuildDir: ${{ github.workspace }}\build-arm64
      InstallDir: ${{ github.workspace }}\out-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_arm64'
          dir: '${{ github.workspace }}'
          modules: 'qt5compat qtimageformats qtsvg qttools qtranslations'
    
      - name: Set build variables
        shell: pwsh
        run: |
          "QtRoot=$env:QT_ROOT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BuildDir=${{ github.workspace }}\build-arm64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "InstallDir=${{ github.workspace }}\out-arm64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        
      - name: Show ledger
        shell: pwsh
        run: |
          Write-Host 'Ledger'
          Write-Host "QtRoot     = $env:QtRoot"
          Write-Host "BuildDir   = $env:BuildDir"
          Write-Host "InstallDir = $env:InstallDir"
          Write-Host "PATH       = $env:PATH"

      - name: Patch Windows stub
        shell: pwsh
        run: |
          $file = '.\qimgv\components\scriptmanager\scriptmanager.cpp'
          $text = Get-Content $file -Raw
          $text = $text -replace 'QString ScriptManager::runCommand\(QString cmd\) \{\}', 'QString ScriptManager::runCommand(QString cmd) { return {}; }'
          Set-Content -Path $file -Value $text -NoNewline

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B "$env:BuildDir" -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:InstallDir" `
            -DCMAKE_PREFIX_PATH="$env:QtRoot" `
            -DQT_DIR="$env:QtRoot\lib\cmake\Qt6" `
            -DQt6_DIR="$env:QtRoot\lib\cmake\Qt6" `
            -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON `
            -DUSE_QT5=OFF `
            -DVIDEO_SUPPORT=OFF `
            -DEXIV2=OFF `
            -DOPENCV_SUPPORT=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake --build "$env:BuildDir" --config Release

      - name: Install
        shell: pwsh
        run: |
          cmake --install "$env:BuildDir" --config Release

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          & "$env:QtRoot\bin\windeployqt.exe" --release "$env:InstallDir\bin\qimgv.exe"

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:InstallDir\*" -DestinationPath "$env:GITHUB_WORKSPACE\qimgv-windows-arm64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qimgv-windows-arm64
          path: qimgv-windows-arm64.zip
